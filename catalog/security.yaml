    area: standards
    why: The baseline list of web-app risk categories an agent should check any project against; 2025 adds Software Supply Chain Failures and Mishandling of Exceptional Conditions.
    practices:
      - text: Map every finding and design review to a Top 10:2025 category (A01 Broken Access Control stays first; A02 is now Security Misconfiguration; A03 Software Supply Chain Failures is new).
        source: https://owasp.org/Top10/2025/
    resources:

  - id: security.webvulns.command-injection
    title: OS command injection
    area: webvulns
    why: Shelling out with user data is still common in scripts and agents; use argv arrays, never shell strings, and prefer library calls over binaries.
    practices:
      - text: Call subprocess/execFile/exec.Command with an argument list and shell=False; if a shell is unavoidable, allowlist the argument and quote with shlex.quote or equivalent.
        source: https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html

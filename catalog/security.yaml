  - id: security.authn.mfa-totp
    title: Multi-factor authentication (TOTP, recovery codes)
    area: authn
    why: Add TOTP (RFC 6238) with recovery codes and rate limits; avoid SMS; prefer passkeys when the audience allows.
    practices:
      - text: Store TOTP secrets encrypted, accept a +/-1 step window, reject reuse of a code, rate-limit attempts, and issue single-use hashed recovery codes.

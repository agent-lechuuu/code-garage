  - id: security.web.csp
    title: Content Security Policy
    area: web
    why: 'The strongest XSS mitigation: a nonce- or hash-based strict CSP with no unsafe-inline, plus Trusted Types for DOM sinks.'
    practices:
      - text: Deploy a strict CSP (script-src 'nonce-...' 'strict-dynamic'; object-src 'none'; base-uri 'none') in report-only first, fix violations, then enforce; avoid allowlists of CDN hosts, they are bypassable.
        source: https://web.dev/articles/strict-csp
    resources:

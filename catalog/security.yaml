  - id: security.crypto.post-quantum
    title: Post-quantum cryptography migration
    area: crypto
    why: ML-KEM/ML-DSA (FIPS 203/204) are standardised and shipping in TLS; new designs should use hybrid key exchange and plan signature migration.
    practices:
      - text: Enable hybrid X25519+ML-KEM in TLS (default in Go 1.24+, OpenSSL 3.5, rustls/aws-lc, browsers) and inventory long-lived encrypted data first; do not deploy standalone PQ signatures in production yet without a reason.

  - id: security.authn.session-management
    title: Session management
    area: authn
    why: Server-side sessions with random IDs, secure cookie flags, rotation on login/privilege change, idle and absolute timeouts, and proper logout.
    practices:
      - text: Generate session IDs with a CSPRNG (128+ bits), set cookies with Secure, HttpOnly, SameSite=Lax and the __Host- prefix, rotate the ID on authentication, and invalidate server-side on logout.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html

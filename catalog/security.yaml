  - id: security.webvulns.idor-mass-assignment
    title: IDOR, BOLA and mass assignment
    area: webvulns
    why: Broken object-level authorisation is the number-one API bug; every object fetch needs an ownership/permission check, and binders must allowlist fields.
    practices:
      - text: Check authorisation on every object access server-side using the session identity (not IDs from the client); bind request bodies to explicit DTOs/allowlists so clients cannot set role, owner or price fields.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
    resources:

  - id: security.webvulns.csrf
    title: CSRF protection
    area: webvulns
    why: 'State-changing requests need a CSRF defence: framework tokens, SameSite cookies, Fetch Metadata (Sec-Fetch-Site) or the stdlib middleware now available in Go.'
    practices:
      - text: Prefer the framework's built-in CSRF middleware plus SameSite=Lax cookies; for APIs with bearer tokens CSRF is moot, for cookie-authenticated JSON APIs require a custom header and check Origin/Sec-Fetch-Site.

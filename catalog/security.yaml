  - id: security.lang.go
    title: Secure Go
    area: lang
    why: Go's security story (govulncheck, os.Root, CrossOriginProtection, gosec) and the OWASP Go secure coding guide.
    practices:
      - text: Run govulncheck in CI; it only reports vulnerabilities in code paths you actually call, so it is low-noise.
        source: https://go.dev/security/vuln/
      - text: Use os.Root (Go 1.24+) for any filesystem access rooted under a directory to stop path traversal and symlink escapes.
        source: https://go.dev/blog/osroot

  - id: security.lang.nodejs
    title: Secure Node.js and TypeScript
    area: lang
    why: Node-specific risks (prototype pollution, ReDoS, eval/new Function, child_process, insecure deps, permission model) and the guides and linters for them.
    practices:
      - text: Use execFile/spawn with an argument array, never exec with string interpolation; validate with an allowlist before any shell call.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
      - text: Install with --ignore-scripts in CI and enable the Node permission model (--permission) for tools that process untrusted input.
        source: https://nodejs.org/en/learn/getting-started/security-best-practices
    resources:
      - name: Node.js security best practices (official)

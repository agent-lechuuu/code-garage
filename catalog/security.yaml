  - id: security.webvulns.input-validation
    title: Input validation and allowlisting
    area: webvulns
    why: 'First line of defence for every endpoint: schema-validate structure and type, allowlist values, reject rather than sanitise, and treat redirects/URLs as input too.'
    practices:
      - text: Validate syntax then semantics with a schema library at the boundary; validation is a defence-in-depth layer, output encoding and parameterised queries are the primary injection controls.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
      - text: For redirects, allowlist destinations or map to server-side IDs; never redirect to a user-supplied absolute URL.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html

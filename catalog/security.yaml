  - id: security.secrets.leak-response
    title: Responding to a leaked secret
    area: secrets
    why: 'What to do in the first hour: revoke and rotate, find usage, purge history, and add detection so it does not recur.'
    practices:
      - text: Rotate the credential immediately (assume it was harvested within minutes of the push), audit its usage logs, then rewrite history with git-filter-repo and force-push only after everyone has pulled; add the pattern to your scanner.

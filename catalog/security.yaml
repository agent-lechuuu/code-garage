  - id: security.hardening.systemd-sandboxing
    title: systemd service sandboxing
    area: hardening
    why: Every service unit can be confined (ProtectSystem, PrivateTmp, NoNewPrivileges, CapabilityBoundingSet, SystemCallFilter) with a few lines; systemd-analyze security scores it.
    practices:
      - text: Start with DynamicUser=yes, ProtectSystem=strict, ProtectHome=yes, PrivateTmp=yes, NoNewPrivileges=yes, RestrictAddressFamilies, SystemCallFilter=@system-service, then iterate until systemd-analyze security <unit> is below 3 without breaking the service.
        source: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html
    resources:
      - name: systemd.exec man page

  - id: security.webvulns.sqli
    title: SQL injection prevention and DB access control
    area: webvulns
    why: Parameterised queries everywhere, least-privilege DB roles, and knowing how attackers test (sqlmap) so you can verify the fix.
    practices:
      - text: Use prepared statements or the ORM parameter API for every query including ORDER BY and LIMIT (allowlist identifiers there); the DB user the app runs as must not own the schema or have superuser rights.

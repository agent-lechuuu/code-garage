  - id: security.authn.oauth-oidc
    title: OAuth 2.0 / OpenID Connect done safely
    area: authn
    why: Use the authorization-code flow with PKCE everywhere, follow RFC 9700 (OAuth 2.0 Security Best Current Practice), and never roll your own token endpoint.
    practices:
      - text: Authorization code + PKCE for all clients (no implicit or password grants), exact redirect URI matching, state and nonce checked, short-lived access tokens with rotating refresh tokens, and sender-constrain tokens where possible.
        source: https://datatracker.ietf.org/doc/html/rfc9700
    resources:

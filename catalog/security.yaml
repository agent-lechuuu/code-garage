  - id: security.webvulns.xss-output-encoding
    title: XSS prevention and output encoding
    area: webvulns
    why: Encode for the exact output context (HTML body, attribute, JS, URL, CSS), use framework auto-escaping, and lock down DOM sinks with Trusted Types.
    practices:
      - text: Use the template engine's auto-escaping and never build HTML by string concatenation; for DOM sinks (innerHTML, eval, setTimeout strings) enforce Trusted Types via CSP require-trusted-types-for.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

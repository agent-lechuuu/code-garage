  - id: security.webvulns.file-upload
    title: Secure file upload
    area: webvulns
    why: Uploads combine traversal, content-type spoofing, malware, image-parser bugs and storage DoS; validate by magic bytes, rename, store outside the web root, scan.
    practices:

  - id: security.authn.password-storage
    title: Password storage and strength (Argon2id, zxcvbn, breached-password checks)
    area: authn
    why: Hash passwords with Argon2id (bcrypt as fallback), check strength with zxcvbn and against breached-password lists instead of composition rules.
    practices:
      - text: Use Argon2id with at least m=19 MiB, t=2, p=1 (OWASP minimum) or bcrypt cost 10+ with a 72-byte pre-hash guard; store the parameters with the hash and rehash on login when they are below policy.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      - text: 'Follow NIST 800-63B: minimum 8 (ideally 15) characters, allow 64+, no forced rotation or composition rules, and block passwords found in breach corpora via the k-anonymity Pwned Passwords API.'
        source: https://pages.nist.gov/800-63-4/
    resources:
      - name: OWASP Password Storage Cheat Sheet

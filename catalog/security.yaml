  - id: security.authn.jwt-tokens
    title: JWT and token handling
    area: authn
    why: Verify algorithm and key explicitly, keep tokens short-lived, store them out of reach of XSS, and consider PASETO or opaque tokens where JWT flexibility is not needed.
    practices:
      - text: Pin the expected alg and key per issuer (reject none and key-confusion), validate iss/aud/exp/nbf, keep access tokens minutes-lived, and never put secrets or PII in claims.
        source: https://datatracker.ietf.org/doc/html/rfc8725
    resources:
      - name: RFC 8725 - JSON Web Token Best Current Practices

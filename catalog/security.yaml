  - id: security.webvulns.redos
    title: ReDoS and regex safety
    area: webvulns
    why: Backtracking regexes on user input can hang a service; detect catastrophic patterns and use linear-time engines where possible.
    practices:
      - text: Lint regexes with recheck in CI; for user-controlled patterns or hot paths use a linear engine (RE2, Go regexp, Rust regex) and always bound input length.

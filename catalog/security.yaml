  - id: security.ai.mcp-security
    title: MCP server security (tool poisoning, rug pulls, shadowing, checklists)
    area: ai
    why: MCP servers are code and instructions the agent trusts; tool descriptions can carry hidden instructions, servers can change after approval, and one server can hijack calls to another.
    practices:
      - text: Install MCP servers only from pinned versions you have read, show full tool descriptions to the human at install, pin and re-verify descriptions (hash) on every start, keep servers for untrusted data separate from servers with credentials, and run servers in containers with minimal filesystem and network.
        source: https://modelcontextprotocol.io/specification/draft/basic/security_best_practices

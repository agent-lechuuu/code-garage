  - id: security.crypto.right-answers
    title: Cryptographic right answers (what to use, what to avoid)
    area: crypto
    why: Default choices for each need (encrypt, sign, hash, KDF, random, TLS) so an agent never picks an algorithm or mode itself.
    practices:
      - text: 'Symmetric: XChaCha20-Poly1305 or AES-256-GCM via a high-level library; signatures: Ed25519; key exchange: X25519 (hybrid with ML-KEM for new designs); passwords: Argon2id; hashing: SHA-256/BLAKE2; random: the OS CSPRNG; never hand-roll modes or padding.'
        source: https://www.latacora.com/blog/2024/07/29/crypto-right-answers-pq/
    resources:
      - name: Latacora - Cryptographic Right Answers, Post-Quantum Edition (2024)
        url: https://www.latacora.com/blog/2024/07/29/crypto-right-answers-pq/

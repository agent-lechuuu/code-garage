  - id: security.web.cors
    title: CORS configuration
    area: web
    why: Misconfigured CORS (reflecting Origin with credentials, null origin, regex mistakes) turns an API into a cross-site data leak.
    practices:
      - text: 'Allowlist exact origins (never reflect the request Origin with Access-Control-Allow-Credentials: true), do not allow the null origin, keep preflight caching short, and remember CORS is not an access control.'
        source: https://portswigger.net/web-security

  - id: security.authn.abuse-prevention
    title: Rate limiting, credential stuffing and account-recovery flows
    area: authn
    why: Brute force, credential stuffing, enumeration via error messages, and insecure password reset are the usual ways authentication fails in practice.
    practices:
      - text: Rate-limit by account and IP, return identical responses for unknown users, use single-use time-limited reset tokens sent out of band, and never implement security questions.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
    resources:
      - name: OWASP Credential Stuffing Prevention Cheat Sheet
        url: https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html
        kind: guide
        license: CC-BY-SA-4.0
        tier: 1

  - id: security.ai.agent-guard-hooks
    title: Guard hooks for coding agents (block destructive commands, protect secrets)
    area: ai
    why: PreToolUse hooks that deny rm -rf, force-push, DROP TABLE, reads of .env/keys and other irreversible actions before the agent runs them; cheap insurance on top of permissions and sandboxing.

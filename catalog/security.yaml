  - id: security.lang.python
    title: Secure Python
    area: lang
    why: Python-specific footguns (pickle, yaml.load, subprocess shell=True, eval, tarfile extraction, XML) and the tools that catch them.
    practices:
      - text: Never unpickle or yaml.load untrusted data; use json or yaml.safe_load, and use defusedxml for XML from outside.
        source: https://docs.python.org/3/library/security_warnings.html
      - text: Run bandit (SAST) and pip-audit (SCA) in CI; both are Apache-2.0 and fast.
        source: https://github.com/PyCQA/bandit
    resources:
      - name: Python security considerations (official docs)
        url: https://docs.python.org/3/library/security_warnings.html
        kind: docs
        license: none
        tier: 1
        use: reference
        note: Index of stdlib modules with security notes (pickle, subprocess, tempfile, xml, ssl).
      - name: PyCQA/bandit

  - id: security.webvulns.api-graphql
    title: GraphQL and API-specific hardening
    area: webvulns
    why: GraphQL adds introspection leaks, query depth/complexity DoS, batching brute force and field-level authz gaps on top of the usual API risks.
    practices:
      - text: Disable introspection in production, enforce depth and cost limits, use persisted queries where possible, and apply authorisation per field/resolver, not per endpoint.

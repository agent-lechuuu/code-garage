  - id: security.web.cookies
    title: Cookie security and client-side storage
    area: web
    why: Secure, HttpOnly, SameSite, __Host- prefix, scoping and expiry; and why tokens do not belong in localStorage.
    practices:
      - text: 'Session cookies: Secure; HttpOnly; SameSite=Lax (Strict for admin); Path=/; name prefixed __Host-; no Domain attribute; never store bearer tokens in localStorage where any XSS can read them.'
        source: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html

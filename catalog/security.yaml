  - id: security.ai.agent-sandboxing
    title: Sandboxing coding agents and MCP servers
    area: ai
    why: Agents run shell and tools; confine filesystem and network per session so a prompt injection cannot read secrets or exfiltrate; also how to run many MCP servers safely.
    practices:
      - text: Run agents with Claude Code sandboxing or sandbox-runtime (bubblewrap/Seatbelt plus a network proxy allowlist), keep credentials out of the sandbox filesystem, and run MCP servers in containers via ToolHive or Docker MCP Toolkit rather than as host processes.

  - id: security.webvulns.ssrf
    title: SSRF prevention
    area: webvulns
    why: Any server-side fetch of a user-influenced URL must block internal ranges, resolve-then-connect to the same IP, disable redirects, and ideally go through an egress proxy.
    practices:
      - text: Allowlist destination hosts where possible; otherwise resolve DNS, reject private/link-local/metadata ranges (including IPv6 and 0.0.0.0), pin the resolved IP for the connection and cap redirects at zero.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html

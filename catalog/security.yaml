        kind: guide
        license: CC-BY-SA-4.0
        tier: 1
        use: reference
        note: Algorithm and key-size minimums plus storage patterns.
      - name: Soatok - Why AES-GCM Sucks
        url: https://soatok.blog/2020/05/13/why-aes-gcm-sucks/
        kind: guide
        license: none
        tier: 2
        use: reference
        note: Nonce-misuse and limits explained; why XChaCha20-Poly1305 is the safer default.
      - name: Practical Cryptography for Developers (free book)

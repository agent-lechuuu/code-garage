  - id: security.supplychain.lockfile-hygiene
    title: Lockfile hygiene, install scripts and release cooldowns
    area: supplychain
    why: The 2025 npm worm attacks (chalk/debug, Shai-Hulud, nx) spread via install scripts and fresh releases; frozen lockfiles, --ignore-scripts and a minimum release age block most of them.
    practices:
      - text: Always install from the lockfile in CI (npm ci, pnpm install --frozen-lockfile, uv sync --locked, cargo --locked), set ignore-scripts=true for npm/pnpm, and configure pnpm minimumReleaseAge (or npm --before) to 1-7 days.
        source: https://pnpm.io/settings#minimumreleaseage
      - text: Lint lockfiles for non-registry URLs and hash drift (lockfile-lint) and review lockfile diffs in PRs like code.
        source: https://github.com/lirantal/lockfile-lint
    resources:
      - name: pnpm minimumReleaseAge setting
        url: https://pnpm.io/settings#minimumreleaseage
        kind: docs
        license: MIT
        tier: 1
        use: reference
        note: Native cooldown added in pnpm 10.16 after the Sept 2025 attacks; Yarn and Bun added equivalents.

  - id: security.ai.agentic-threats
    title: Agentic AI threats (OWASP Top 10 for Agentic Applications 2026, taxonomies)
    area: ai
    why: Agents add goal hijack, tool misuse, identity/privilege abuse, supply chain of tools and skills, code execution, memory poisoning, inter-agent trust, cascading failures, human-agent trust exploitation, rogue agents.

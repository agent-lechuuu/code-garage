  - id: security.supplychain.github-actions-hardening
    title: GitHub Actions and CI pipeline hardening
    area: supplychain
    why: The tj-actions/changed-files compromise (Mar 2025) showed mutable tags are an attack vector; pin actions by SHA, limit GITHUB_TOKEN, audit workflows for injection.
    practices:
      - text: 'Pin every action to a full commit SHA (pinact/ratchet/Renovate keep them updated), set permissions: read-all at top level, never run pull_request_target with checkout of the PR head, and lint with zizmor.'

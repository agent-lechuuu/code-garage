  - id: security.agents.offensive-agents
    title: Autonomous pentest agents and offensive MCP bundles (Strix, HexStrike, nuclei/shodan MCPs)
    area: agents
    why: Agents that run recon and exploitation tools end to end; powerful and popular, but they execute offensive tooling on whatever target they are pointed at. Reference only, with scope controls.
    practices:
      - text: Never connect an offensive MCP bundle to a general-purpose agent session; run them in a dedicated sandbox with a hard-coded target allowlist and no credentials, and only against systems in a written scope.
        source: https://disclose.io/

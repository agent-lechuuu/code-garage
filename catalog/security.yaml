  - id: security.webvulns.smuggling-race-cache
    title: HTTP request smuggling, race conditions and cache attacks
    area: webvulns
    why: Protocol-level bugs between proxies and origins (desync, cache poisoning/deception) and limit-overrun races; mostly fixed by configuration and idempotent design.
    practices:
      - text: Use HTTP/2 end-to-end or normalise ambiguous requests at the edge, reject requests with both Content-Length and Transfer-Encoding, and make state-changing operations idempotent with DB-level constraints to kill TOCTOU races.
        source: https://portswigger.net/research/smashing-the-state-machine

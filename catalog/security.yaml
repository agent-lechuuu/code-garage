  - id: security.webvulns.deserialization
    title: Insecure deserialisation
    area: webvulns
    why: Native serialisation (Java, pickle, PHP, .NET BinaryFormatter, YAML) executes code on load; use data-only formats or allowlist filters and scan model/pickle files.
    practices:
      - text: Deserialise untrusted input only with data-only formats (JSON, protobuf); if Java serialization is unavoidable, use JEP 290 ObjectInputFilter allowlists; in Python never pickle.load untrusted bytes, scan with fickling.
        source: https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html

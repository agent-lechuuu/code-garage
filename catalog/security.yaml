  - id: security.ai.prompt-injection-defences
    title: Prompt injection defences and agent design patterns
    area: ai
    why: 'There is no filter that stops prompt injection; mitigate by architecture: avoid the lethal trifecta, constrain tool use, separate control from data, and verify actions.'
    practices:
      - text: 'Never give one agent all three of: access to private data, exposure to untrusted content, and a channel to exfiltrate; break the trifecta by removing one, e.g. no network egress or no untrusted input in the same context.'
        source: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
      - text: Apply the six design patterns (action-selector, plan-then-execute, map-reduce, dual LLM, code-then-execute, context minimisation) so untrusted text can never choose which privileged action runs.
        source: https://arxiv.org/abs/2506.08837
    resources:
      - name: Simon Willison - The lethal trifecta for AI agents
        url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
        kind: guide
        license: none
        tier: 1
        use: reference
        note: The clearest framing of agent exfiltration risk; the whole prompt-injection tag on the site is worth reading.
      - name: Design Patterns for Securing LLM Agents against Prompt Injections (2025)

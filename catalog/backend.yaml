  - id: backend.databases.postgres-partitioning
    title: Table partitioning in PostgreSQL
    area: databases
    why: Keep very large or time-based tables fast to query, index and purge.
    practices:
      - text: Partition only when a table is 100M+ rows or has time-based retention; include the partition key in the primary key and every unique constraint; use DETACH CONCURRENTLY to drop old data.
        source: https://www.postgresql.org/docs/current/ddl-partitioning.html
    resources:
      - name: PostgreSQL docs - Table Partitioning

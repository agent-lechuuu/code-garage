        kind: guide
        license: NOASSERTION
        stars: 23340
        pushed: 2026-08-05
        archived: false
        tier: 1
        use: reference
        note: Azure-grade conventions for long-running operations, deltas, versioning; CC-BY-4.0 text.
      - name: Google API Improvement Proposals (AIP)
        url: https://google.aip.dev/
        kind: guide
        license: CC-BY-4.0
        tier: 1
        use: reference
        note: Resource-oriented design rules (AIP-121..) that apply equally to REST and gRPC.
      - name: Heroku HTTP API Design Guide
        url: https://github.com/interagent/http-api-design
        kind: guide
        license: NOASSERTION
        stars: 13672
        pushed: 2024-01-16

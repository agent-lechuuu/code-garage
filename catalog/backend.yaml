    area: databases
    why: Default relational database for every project; know where the authoritative docs and the best explanations live.
    practices:
      - text: Run a supported major (18 is current; each major gets 5 years) and read the release notes before upgrading.
        source: https://www.postgresql.org/support/versioning/
      - text: 'Read the wiki''s Don''t Do This before designing a schema: timestamptz not timestamp, text not varchar(n), no money type, no serial in new code.'

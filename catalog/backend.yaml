  - id: backend.safe-db.indexing
    title: Indexing strategy and index advisors
    area: safe-db
    why: Add the right indexes (and only those) for real query patterns, and find missing or unused ones.
    practices:
      - text: Index for the WHERE/JOIN/ORDER BY columns of real slow queries (pg_stat_statements), create CONCURRENTLY, use composite indexes in filter-then-sort order, and drop unused indexes (pg_stat_user_indexes).
        source: https://use-the-index-luke.com/
      - text: 'Choose the index type: B-tree default, GIN for jsonb/arrays/full-text, GiST for ranges/geometry, BRIN for huge append-only tables, HNSW for vectors.'
        source: https://www.postgresql.org/docs/current/indexes-types.html
    resources:
      - name: Use The Index, Luke
        url: https://use-the-index-luke.com/

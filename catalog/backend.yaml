  - id: backend.safe-db.money-and-time-types
    title: Money, decimals, dates and time zones
    area: safe-db
    why: Store and compute money and time without floating-point or time-zone bugs.
    practices:
      - text: Store money as integer minor units or numeric(19,4) with an explicit currency column; never float/double or the Postgres money type.
        source: https://martinfowler.com/eaaCatalog/money.html
      - text: Store instants as timestamptz in UTC, store the IANA zone name separately for user-facing times, and store future local events as local time + zone (rules change).
        source: https://www.postgresql.org/docs/current/datatype-datetime.html
    resources:
      - name: PostgreSQL docs - Numeric Types
        url: https://www.postgresql.org/docs/current/datatype-numeric.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: numeric vs float semantics and precision.

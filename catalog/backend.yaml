  - id: backend.safe-db.maintenance-vacuum-upgrades
    title: Vacuum, bloat and major-version upgrades
    area: safe-db
    why: Keep tables and indexes healthy and move between Postgres majors with minimal downtime.
    practices:
      - text: Tune autovacuum per large table (lower scale factors), monitor bloat and dead tuples, use pg_repack rather than VACUUM FULL, and reindex CONCURRENTLY after big deletes.
        source: https://www.postgresql.org/docs/current/routine-vacuuming.html
      - text: Upgrade with pg_upgrade --link for minutes of downtime or logical replication for near-zero; run ANALYZE after and test extensions first.
        source: https://www.postgresql.org/docs/current/pgupgrade.html
    resources:
      - name: PostgreSQL docs - Routine Vacuuming
        url: https://www.postgresql.org/docs/current/routine-vacuuming.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: Why vacuum exists (MVCC, wraparound) and autovacuum tuning parameters.
      - name: pg_repack

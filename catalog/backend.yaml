  - id: backend.auth.oauth-oidc-libraries
    title: OAuth 2.1 / OpenID Connect libraries
    area: auth
    why: Implement login with external providers or run your own authorization server using certified libraries, never hand-rolled token handling.
    practices:
      - text: Use Authorization Code + PKCE for every client type; OAuth 2.1 removes the implicit and password grants.
        source: https://oauth.net/2.1/
      - text: Validate id_token issuer, audience, nonce and expiry with the provider's JWKS; rotate keys via discovery.
        source: https://openid.net/specs/openid-connect-core-1_0.html

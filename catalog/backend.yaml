  - id: backend.services.http-caching
    title: HTTP caching
    area: services
    why: Let browsers, CDNs and proxies cache responses correctly with the right headers and validators.
    practices:
      - text: Set explicit Cache-Control (max-age, s-maxage, stale-while-revalidate, private/no-store) and ETag or Last-Modified on every cacheable GET; never rely on heuristic caching.

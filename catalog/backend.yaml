  - id: backend.safe-db.connection-pooling
    title: Connection pooling
    area: safe-db
    why: Keep Postgres connection counts low and stable in front of many app instances or serverless functions.
    practices:
      - text: Size the app pool to a few connections per CPU core of the database, use transaction pooling for stateless apps, and avoid session-level features (prepared statements by name, SET, advisory locks) behind a transaction pooler.
        source: https://brandur.org/postgres-connections
    resources:

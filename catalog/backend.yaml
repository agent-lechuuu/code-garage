  - id: backend.agents.database-mcp-servers
    title: Database MCP servers (Postgres, MySQL, SQLite, MongoDB)
    area: agents
    why: Let an agent inspect schemas, run queries and tune indexes against a real Postgres, MySQL, SQLite or MongoDB database, with read-only guard rails.
    tags: [mcp, postgres, postgresql, mysql, sqlite, mongodb, database, sql]
    practices:
      - text: Connect MCP servers with a read-only database role and the server's restricted mode; never hand an agent the owner/superuser DSN.

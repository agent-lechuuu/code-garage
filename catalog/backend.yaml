  - id: backend.runtimes.go-http
    title: Go HTTP routers and frameworks
    area: runtimes
    why: Decide between the Go standard library and a router/framework for an HTTP service.
    practices:
      - text: Go 1.22+ net/http ServeMux supports method and wildcard patterns; start there and add chi only for middleware groups.
        source: https://pkg.go.dev/net/http#ServeMux
      - text: Follow the Uber Go style guide for errors, context propagation and struct design.
        source: https://github.com/uber-go/guide
    resources:
      - name: net/http ServeMux (Go 1.22+)
        url: https://pkg.go.dev/net/http#ServeMux
        kind: docs
        license: BSD-3-Clause
        tier: 1
        use: reference
        note: Standard library routing is enough for most APIs; zero dependencies.
      - name: chi
        url: https://github.com/go-chi/chi
        kind: repo
        license: MIT
        stars: 23023
        pushed: 2026-10-18
        archived: false
        tier: 1
        use: install
        note: Idiomatic net/http-compatible router with middleware groups; the common add-on to stdlib.
      - name: Echo
        url: https://github.com/labstack/echo
        kind: repo
        license: MIT
        stars: 32783
        pushed: 2026-10-28
        archived: false
        tier: 1
        use: install
        note: Full framework (binding, validation hooks, middleware) that stays close to net/http.
      - name: Gin
        url: https://github.com/gin-gonic/gin
        kind: repo
        license: MIT
        stars: 89447
        pushed: 2026-10-10
        archived: false
        tier: 1
        use: install

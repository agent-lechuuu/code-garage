  - id: backend.runtimes.node-typescript
    title: Node.js / TypeScript web frameworks
    area: runtimes
    why: Pick the HTTP framework for a TypeScript service and know which one fits the project size.
    practices:
      - text: Validate every request body, query and header at the edge with a Standard Schema library (zod, valibot, arktype); never trust req.body.
        source: https://github.com/standard-schema/standard-schema
      - text: Target Node 24 or 26 LTS (26 entered LTS on 2026-10-28); Express 5.x is stable and drops callback error handling.
        source: https://endoflife.date/nodejs
    resources:
      - name: Hono
        url: https://github.com/honojs/hono
        kind: repo
        license: MIT
        stars: 32736
        pushed: 2026-10-28
        archived: false
        tier: 1
        use: install
        note: 'Default for new TS APIs: Web-standard Request/Response, runs on Node, Bun, Deno and Workers; ships llms-full.txt.'
      - name: Fastify
        url: https://github.com/fastify/fastify
        kind: repo
        license: MIT
        stars: 37315
        pushed: 2026-10-27
        archived: false
        tier: 1
        use: install
        note: Fastest mature Node-only framework; JSON-schema validation and serialization built in, huge plugin ecosystem.

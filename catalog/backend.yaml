  - id: backend.runtimes.python-web
    title: Python web frameworks
    area: runtimes
    why: Pick the Python framework for an API or full web app and avoid the dead ends.
    practices:
      - text: Use Pydantic v2 models for request/response schemas and keep business logic out of route handlers.
        source: https://github.com/zhanymkanov/fastapi-best-practices
      - text: Never run blocking I/O inside async def endpoints; use sync def (threadpool) or an async driver.
        source: https://fastapi.tiangolo.com/async/
    resources:
      - name: FastAPI
        url: https://github.com/fastapi/fastapi
        kind: repo
        license: MIT
        stars: 104241
        pushed: 2026-10-27
        archived: false

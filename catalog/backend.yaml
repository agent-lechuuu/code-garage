  - id: backend.safe-db.data-modelling
    title: Data modelling, types and constraints
    area: safe-db
    why: Design normalised schemas with the right Postgres types and constraints so the database guards the invariants.
    practices:
      - text: Normalise to 3NF by default, denormalise only with evidence; put every invariant you can into NOT NULL, CHECK, UNIQUE and FK constraints; use text, timestamptz, numeric, jsonb (sparingly) and bigint/uuid keys.
        source: https://wiki.postgresql.org/wiki/Don't_Do_This
    resources:
      - name: PostgreSQL docs - Data Types
        url: https://www.postgresql.org/docs/current/datatype.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: Every built-in type; read before picking varchar(n) or float for money.
      - name: PostgreSQL docs - Constraints
        url: https://www.postgresql.org/docs/current/ddl-constraints.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: CHECK, NOT NULL, UNIQUE, PK, FK and EXCLUDE constraints with deferrable semantics.
      - name: PostgreSQL docs - JSON Types
        url: https://www.postgresql.org/docs/current/datatype-json.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: jsonb operators and indexing; use for genuinely variable attributes, not as a schema escape hatch.
      - name: PostgreSQL wiki - Don't Do This
        url: https://wiki.postgresql.org/wiki/Don't_Do_This
        kind: checklist
        license: none
        tier: 1
        use: reference
        note: Type and schema anti-patterns to avoid.

  - id: backend.auth.sessions-vs-jwt
    title: Sessions, cookies and JWTs
    area: auth
    why: Choose server-side sessions or tokens deliberately and implement whichever one safely.
    practices:
      - text: Prefer server-side sessions (random 120-bit+ id, HttpOnly, Secure, SameSite=Lax) for first-party web apps; use JWTs for stateless service-to-service or short-lived access tokens with refresh.
        source: https://thecopenhagenbook.com/
      - text: Pin the JWT algorithm on verification, check aud/iss/exp, keep access tokens short-lived and never store them in localStorage.
        source: https://github.com/panva/jose
    resources:
      - name: The Copenhagen Book
        url: https://thecopenhagenbook.com/

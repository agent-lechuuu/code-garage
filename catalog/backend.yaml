  - id: backend.safe-db.identifiers
    title: Primary keys and identifiers (UUIDv7, ULID, TypeID)
    area: safe-db
    why: Pick key types that are sortable, index-friendly and safe to expose.
    practices:
      - text: Use bigint identity for internal keys or UUIDv7 (time-ordered) for distributed/exposed keys; avoid random UUIDv4 primary keys on large tables (index fragmentation) and never expose sequential ids publicly.
        source: https://buildkite.com/resources/blog/goodbye-integers-hello-uuids/
    resources:
      - name: RFC 9562 - UUIDs

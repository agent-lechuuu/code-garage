  - id: backend.databases.sqlite-core
    title: SQLite as an application database
    area: databases
    why: 'Use SQLite correctly for single-node services: WAL mode, STRICT tables, pragmas and when not to use it.'
    practices:
      - text: Enable WAL, set busy_timeout and synchronous=NORMAL, use STRICT tables, one writer connection with a pool of readers.
        source: https://kerkour.com/sqlite-for-servers
      - text: SQLite is the right choice for most small-to-medium sites; it is the wrong choice for many concurrent writers across hosts.
        source: https://www.sqlite.org/whentouse.html
    resources:
      - name: SQLite - Appropriate Uses
        url: https://www.sqlite.org/whentouse.html
        kind: docs
        license: none
        tier: 1
        use: reference
        note: The official answer to 'should I use SQLite here'.

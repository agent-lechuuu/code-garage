  - id: backend.api.idempotency-keys
    title: Idempotency keys
    area: api
    why: Make POST requests safely retryable so clients never double-charge or double-create.
    practices:
      - text: Store the key with request fingerprint, status and response; return the stored response on replay; reject the same key with a different payload (422).
        source: https://brandur.org/idempotency-keys
    resources:

  - id: backend.api.rest-design-guidelines
    title: REST API design guidelines
    area: api
    why: Follow a published, battle-tested style guide for URLs, errors, pagination and naming instead of inventing conventions per project.
    practices:
      - text: Return application/problem+json (RFC 9457) for every error; never leak stack traces.
        source: https://www.rfc-editor.org/rfc/rfc9457
      - text: Use cursor (keyset) pagination for any collection that can grow; offset pagination degrades and skips rows.
        source: https://slack.engineering/evolving-api-pagination-at-slack/
      - text: Pick one versioning scheme (date-based headers like Stripe or /v1 path) and keep additive changes unversioned.
        source: https://stripe.com/blog/api-versioning
    resources:
      - name: Zalando RESTful API Guidelines
        url: https://github.com/zalando/restful-api-guidelines
        kind: guide
        license: CC-BY-4.0
        stars: 3262
        pushed: 2026-09-29
        archived: false
        tier: 1
        use: reference
        note: Most complete open guideline (MUST/SHOULD rules, OpenAPI-first, events); lint rules exist for Spectral.
      - name: Microsoft REST API Guidelines

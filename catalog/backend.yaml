  - id: backend.services.redis-patterns-locks
    title: Redis caching and distributed-lock patterns
    area: services
    why: Use cache-aside, TTL jitter, pub/sub, streams and distributed locks correctly rather than reinventing them.
    practices:
      - text: Add jitter to TTLs and use request coalescing to avoid cache stampedes; never cache without an expiry.
        source: https://redis.io/docs/latest/develop/
      - text: Use Redlock-style locks only with a lease and fencing token; prefer a Postgres advisory lock when the data lives in Postgres anyway.
        source: https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/
    resources:
      - name: Redis developer docs
        url: https://redis.io/docs/latest/develop/
        kind: docs
        license: none
        tier: 1
        use: reference
        note: Data types, patterns (caching, locks, bulk loading), streams; redis.io serves llms.txt.
      - name: Distributed locks with Redis (Redlock)

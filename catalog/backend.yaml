  - id: backend.jobs.postgres-as-queue
    title: Using Postgres as the queue
    area: jobs
    why: Avoid running Redis/RabbitMQ by queuing in the database correctly with SKIP LOCKED and transactional enqueue.
    practices:
      - text: Claim jobs with SELECT ... FOR UPDATE SKIP LOCKED LIMIT n, keep claim transactions short, and enqueue in the same transaction as the business write.
        source: https://www.postgresql.org/docs/current/sql-select.html
    resources:
      - name: pgmq
        url: https://github.com/pgmq/pgmq
        kind: repo
        license: PostgreSQL
        stars: 5359
        pushed: 2026-10-20
        archived: false
        tier: 1
        use: install
        note: SQS-like queue as a Postgres extension (visibility timeouts, archive); client libs in several languages.
      - name: PostgreSQL SELECT docs (FOR UPDATE SKIP LOCKED)
        url: https://www.postgresql.org/docs/current/sql-select.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: The locking clause that makes safe concurrent job claiming possible.
      - name: What is SKIP LOCKED for in PostgreSQL 9.5?
        url: https://www.2ndquadrant.com/en/blog/what-is-select-skip-locked-for-in-postgresql-9-5/
        kind: guide
        license: none
        tier: 1
        use: reference
        note: Classic explanation of the queue pattern and its pitfalls.
      - name: Transactionally Staged Job Drains in Postgres
        url: https://brandur.org/job-drain
        kind: guide
        license: none
        tier: 1
        use: reference
        note: Stage jobs in a table inside the transaction, drain to the real queue; solves the enqueue-before-commit bug.
    see_also: [backend.jobs.queues-node, backend.jobs.queues-go-rust, backend.jobs.queues-python]


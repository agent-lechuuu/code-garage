  - id: backend.safe-db.soft-deletes-audit-history
    title: Soft deletes, audit trails and history tables
    area: safe-db
    why: Decide how to delete and how to keep a record of changes without polluting every query.
    practices:
      - text: Prefer hard deletes plus a deleted_records archive table (or temporal history) over deleted_at columns that every query must remember to filter; if you soft-delete, enforce it with views or ORM default scopes and partial unique indexes.
        source: https://brandur.org/soft-deletion

  - id: backend.safe-db.transactions-isolation
    title: Transactions and isolation levels
    area: safe-db
    why: Pick the isolation level that actually prevents the anomaly you care about, and handle serialization failures.
    practices:
      - text: Postgres default READ COMMITTED allows lost updates and write skew; use SELECT ... FOR UPDATE or SERIALIZABLE with retry for check-then-write logic; keep transactions short.
        source: https://www.postgresql.org/docs/current/transaction-iso.html
    resources:

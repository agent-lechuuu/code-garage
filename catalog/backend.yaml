  - id: backend.safe-db.performance-monitoring-tuning
    title: Performance monitoring and configuration tuning
    area: safe-db
    why: See which queries cost the most and set the handful of Postgres settings that matter for the hardware.
    practices:
      - text: Enable pg_stat_statements everywhere, review top queries by total_exec_time weekly, and start config from PGTune values (shared_buffers ~25% RAM, effective_cache_size, work_mem per sort, random_page_cost 1.1 on SSD).
        source: https://pgtune.leopard.in.ua/
    resources:

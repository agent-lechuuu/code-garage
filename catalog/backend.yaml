  - id: backend.safe-db.row-level-security-roles
    title: Row-level security, roles and privileges
    area: safe-db
    why: Enforce tenant and user data isolation in the database and give each app component least-privilege roles.
    practices:
      - text: Use separate roles for migrations (owner), the app (DML only) and read-only analytics; never connect the app as a superuser.
        source: https://www.postgresql.org/docs/current/ddl-priv.html
      - text: RLS policies must use indexed columns, wrap function calls like auth.uid() in (select ...) so they are evaluated once, and be tested with SET ROLE for each role.
        source: https://supabase.com/docs/guides/database/postgres/row-level-security
    resources:
      - name: PostgreSQL docs - Row Security Policies
        url: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: ENABLE/FORCE ROW LEVEL SECURITY semantics, USING vs WITH CHECK, bypass rules.
      - name: PostgreSQL docs - CREATE POLICY
        url: https://www.postgresql.org/docs/current/sql-createpolicy.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: Policy syntax, permissive vs restrictive policies, per-command policies.

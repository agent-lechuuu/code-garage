  - id: backend.safe-db.locking
    title: Locking and lock monitoring
    area: safe-db
    why: Understand which statements take which locks, detect blocking chains and avoid deadlocks.
    practices:
      - text: Acquire locks in a consistent order, keep DDL and long transactions apart, set lock_timeout, and use advisory locks for application-level mutual exclusion.
        source: https://www.postgresql.org/docs/current/explicit-locking.html
    resources:
      - name: PostgreSQL docs - Explicit Locking
        url: https://www.postgresql.org/docs/current/explicit-locking.html
        kind: docs
        license: PostgreSQL
        tier: 1
        use: reference
        note: Lock modes, conflict matrix, row locks, deadlocks and advisory locks.
      - name: pglocks.org
        url: https://pglocks.org/
        kind: tool
        license: none
        tier: 1
        use: reference
        note: Interactive table of which lock every SQL command takes and what it conflicts with.
      - name: PostgreSQL wiki - Lock Monitoring
        url: https://wiki.postgresql.org/wiki/Lock_Monitoring
        kind: snippet
        license: none
        tier: 1
        use: reference
        note: Ready queries over pg_locks/pg_stat_activity to find blockers and blocked sessions.
      - name: Postgres lock trees (postgres.ai)

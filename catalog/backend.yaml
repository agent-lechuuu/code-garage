  - id: backend.safe-db.zero-downtime-migration-guides
    title: Zero-downtime schema migrations (the rules)
    area: safe-db
    why: Change production schemas without locking tables or taking the app down; these are the rules every migration linter encodes.
    practices:
      - text: Always set lock_timeout (and statement_timeout) before DDL and retry on failure; a blocked ALTER queues every other query behind it.
        source: https://postgres.ai/blog/20220525-common-db-schema-change-mistakes
      - text: CREATE INDEX CONCURRENTLY; add NOT NULL via a NOT VALID check constraint then VALIDATE; add foreign keys NOT VALID then VALIDATE; never ALTER COLUMN TYPE on a big table in place.
        source: https://www.braintreepayments.com/blog/safe-operations-for-high-volume-postgresql/
      - text: 'Separate schema changes from data backfills and deploys: expand (add nullable column) -> backfill in batches -> switch code -> contract (drop old) in a later release.'
        source: https://docs.gitlab.com/development/database/avoiding_downtime_in_migrations/
    resources:
      - name: Common DB schema change mistakes (postgres.ai)
        url: https://postgres.ai/blog/20220525-common-db-schema-change-mistakes
        kind: guide
        license: none
        tier: 1

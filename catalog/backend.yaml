  - id: backend.safe-db.bulk-loading
    title: Bulk loading and large data operations
    area: safe-db
    why: Load millions of rows or migrate from another database fast without wrecking production performance.
    practices:
      - text: Use COPY (not INSERT loops), load in batches of thousands with periodic commits, drop/recreate indexes and FKs for initial loads, raise maintenance_work_mem, and ANALYZE afterwards.
        source: https://www.postgresql.org/docs/current/populate.html

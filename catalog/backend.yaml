        kind: tool
        license: BSD-3-Clause
        stars: 2317
        pushed: 2026-10-27
        archived: false
        tier: 1
        use: install
        note: Rebuild bloated tables/indexes online with only brief locks; pg_squeeze is the extension-based alternative.
      - name: pgsql-bloat-estimation

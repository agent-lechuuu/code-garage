  - id: ai.prompting.context-engineering
    title: Context engineering (what goes in the window and when)
    area: prompting
    why: 'Beyond prompt wording: retrieval timing, compaction, sub-agent isolation and tool-result hygiene decide long-task quality.'
    practices:
      - text: Find the smallest set of high-signal tokens that maximizes the likelihood of the desired outcome; prefer just-in-time retrieval over pre-loading.
        source: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
      - text: 'Budget the context window explicitly: know the model''s window, compaction behaviour and when tool results are cleared.'
        source: https://platform.claude.com/docs/en/build-with-claude/context-windows.md
    resources:
      - name: Effective context engineering for AI agents (Anthropic)

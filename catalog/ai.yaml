topics:

  - id: ai.skills.format
    title: Agent Skills format (SKILL.md) and specification
    area: skills
    why: The portable instruction-folder format every agent in the garage loads; know the frontmatter rules before writing or vendoring a skill.
    practices:
      - text: name is 1-64 chars, lowercase/digits/hyphens, must equal the folder name; description is 1-1024 chars and must say what the skill does AND when to use it.
        source: https://agentskills.io/specification
      - text: Keep SKILL.md under 500 lines (~5k tokens); move detail to references/ and scripts/ loaded on demand (progressive disclosure).
        source: https://agentskills.io/specification
      - text: 'Validate with the reference library: skills-ref validate ./my-skill.'
        source: https://github.com/agentskills/agentskills/tree/main/skills-ref
    resources:
      - name: Agent Skills specification
        url: https://agentskills.io/specification
        kind: docs
        license: none
        tier: 1
        use: reference
        note: The open spec (frontmatter fields, folder layout, progressive disclosure). llms.txt at https://agentskills.io/llms.txt.
      - name: agentskills/agentskills (spec repo + skills-ref validator)
        url: https://github.com/agentskills/agentskills/tree/HEAD/skills-ref
        kind: repo
        license: Apache-2.0
        stars: 26732
        pushed: 2026-08-09
        archived: false
        tier: 1
        use: reference
        path: skills-ref
        note: Source of the spec and the skills-ref validation library; run the validator in CI for any skill you vendor.
      - name: Agent Skills overview (Claude platform docs)
        url: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview.md
        kind: docs
        license: none
        tier: 1
        use: reference
        note: How skills load in the API, Claude Code and claude.ai; best practices page at /agents-and-tools/agent-skills/best-practices.md.

  - id: ai.agents.evaluation
    title: Evaluating coding agents (SWE-bench, Terminal-Bench, harnesses)
    area: agents
    why: Measure a harness or model change on real tasks instead of vibes; know which benchmarks are saturated or noisy.
    practices:
      - text: Expect several points of run-to-run infrastructure noise on agentic benchmarks; report multiple trials and fix the environment before trusting a delta.

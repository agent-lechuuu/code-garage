  - id: ai.llm-apps.messages-features
    title: Claude Messages API capabilities (tool use, structured outputs, caching, thinking, batches, files)
    area: llm-apps
    why: The feature pages an app builder needs; each has an official cookbook notebook.
    practices:
      - text: Put stable content (system prompt, tools, documents) first and mark cache breakpoints; caching cuts cost up to 90% and latency up to 85% on repeated prefixes.
        source: https://platform.claude.com/docs/en/build-with-claude/prompt-caching.md
      - text: Use structured outputs (JSON schema / strict tools) instead of parsing free text; validate anyway.
        source: https://platform.claude.com/docs/en/build-with-claude/structured-outputs.md
      - text: Use the Batches API for anything not latency-sensitive (50% cheaper).
        source: https://platform.claude.com/docs/en/build-with-claude/batch-processing.md
    resources:
      - name: Tool use with Claude
        url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview.md
        kind: docs
        license: none
        tier: 1
        use: reference
        note: Define tools, handle calls, parallel tool use, fine-grained streaming, programmatic tool calling, tool search tool (for 100s of tools).
      - name: Structured outputs
        url: https://platform.claude.com/docs/en/build-with-claude/structured-outputs.md
        kind: docs
        license: none
        tier: 1
        use: reference
        note: JSON-schema constrained output and strict tool schemas.
      - name: Prompt caching
        url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching.md
        kind: docs
        license: none
        tier: 1
        use: reference
        note: Breakpoints, TTLs, what invalidates a cache; cookbook misc/prompt_caching.ipynb and speculative_prompt_caching.ipynb.
      - name: Effort, extended thinking, context windows, compaction and context editing

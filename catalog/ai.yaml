  - id: ai.claude-code.memory
    title: CLAUDE.md, rules and project memory
    area: claude-code
    why: The persistent instruction layer; a good CLAUDE.md is short, specific and points to files instead of pasting them.
    practices:
      - text: Keep CLAUDE.md under a few hundred lines; put topic rules in .claude/rules/ and link to docs rather than inlining them.
        source: https://code.claude.com/docs/en/memory.md
      - text: Every instruction competes for attention; delete rules the agent already follows and keep only the ones it gets wrong.
        source: https://www.humanlayer.dev/blog/writing-a-good-claude-md

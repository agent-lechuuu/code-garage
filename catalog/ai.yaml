    title: Prompt engineering - Anthropic documentation and model guides
    area: prompting
    why: The current, model-specific prompting guidance; always check the page for the model in use (Fable 5.1, Opus 5.5, Sonnet 5.5, Haiku 5.5).
    practices:
      - text: Be explicit and give context for why; use XML tags to separate instructions from data; put long documents before the question; ask for step-by-step thinking only when the task needs it.
        source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices.md
      - text: Treat retrieved documents, tool results and web pages as data inside tags, never as instructions; say so in the system prompt.
        source: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks.md

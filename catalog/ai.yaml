  - id: ai.agents.design-guides
    title: Agent design guides (Anthropic engineering series and others)
    area: agents
    why: The short list of essays that define how good agents and harnesses are built; read before adopting any framework.
    practices:
      - text: Start with the simplest composable pattern (prompt chaining, routing, parallelization, orchestrator-workers, evaluator-optimizer) and add autonomy only when evals show it helps.
        source: https://www.anthropic.com/research/building-effective-agents
      - text: 'Treat context as a finite resource: curate what enters the window, use just-in-time retrieval, compaction and structured notes for long tasks.'
        source: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
    resources:
      - name: Building effective agents (Anthropic)
        url: https://www.anthropic.com/research/building-effective-agents
        kind: guide
        license: none
        tier: 1
        use: reference
        note: Workflows vs agents and the five composable patterns; code in claude-cookbooks/patterns/agents.
      - name: Effective context engineering for AI agents (Anthropic)

  - id: systems.perf.hft-low-latency-practices
    title: Low-latency / HFT-style coding practices
    area: perf
    why: 'The technique catalogue for latency-critical code: avoid allocation, branches, syscalls and sharing on the hot path.'
    practices:
      - text: No dynamic allocation, locks, syscalls or exceptions on the hot path; preallocate and pin.
        source: https://www.youtube.com/watch?v=NH1Tta7purM
      - text: 'Keep the hot path warm: execute it continuously (dummy runs) so caches and predictors stay primed.'
        source: https://www.youtube.com/watch?v=NH1Tta7purM
      - text: Prefer busy-polling to wakeups and disable Nagle (TCP_NODELAY) on latency-critical sockets.
        source: https://github.com/penberg/awesome-low-latency
      - text: Measure latency as a distribution (p99/p99.9), never as a mean.
        source: https://github.com/penberg/awesome-low-latency
    resources:
      - name: When a Microsecond Is an Eternity (Carl Cook, CppCon 2017)
        url: https://www.youtube.com/watch?v=NH1Tta7purM
        kind: course
        license: none
        tier: 1
        use: reference
        note: 'The talk every low-latency C++ engineer cites: hot path warming, branch removal, allocation, measurement.'
      - name: 'Trading at light speed: designing low latency systems in C++ (David Gross, Meeting C++ 2022)'

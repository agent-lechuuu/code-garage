  - id: systems.c.sanitizers
    title: 'Sanitizers: ASan, UBSan, TSan, MSan, LSan'
    area: c
    why: Catching memory errors, UB and data races at test time in C/C++ (and Rust via nightly).
    practices:
      - text: Run ASan+UBSan on the test suite in CI; add -fno-omit-frame-pointer for readable traces.
        source: https://github.com/google/sanitizers/wiki
      - text: TSan needs its own build (not combined with ASan).
        source: https://clang.llvm.org/docs/ThreadSanitizer.html
    resources:
      - name: google/sanitizers wiki
        url: https://github.com/google/sanitizers
        kind: docs
        license: Apache-2.0 WITH LLVM-exception
        stars: 12514
        pushed: 2026-10-26
        archived: false
        tier: 1
        use: reference
        note: 'Canonical wiki: flags, suppressions, known limits for every sanitizer.'
      - name: AddressSanitizer (Clang docs)
        url: https://clang.llvm.org/docs/AddressSanitizer.html
        kind: docs
        license: Apache-2.0 WITH LLVM-exception
        tier: 1
        use: reference
        note: Exact flags and runtime options; also covers LeakSanitizer.
      - name: ThreadSanitizer (Clang docs)
        url: https://clang.llvm.org/docs/ThreadSanitizer.html
        kind: docs
        license: Apache-2.0 WITH LLVM-exception
        tier: 1
        use: reference
        note: Data-race detector; incompatible with ASan in the same build, run a separate CI job.
      - name: Valgrind user manual
        url: https://valgrind.org/docs/manual/
        kind: docs
        license: GPL-2.0
        tier: 2
        use: reference
        note: Memcheck/Helgrind/Massif when you cannot recompile with sanitizers; ~20-50x slower.
    see_also: [systems.profiling.memory-profilers, security.fuzzing.native]


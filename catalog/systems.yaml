topics:

  - id: systems.c.modern-c
    title: Modern C (C17/C23) and safe defaults
    area: c
    why: 'Writing new C: which standard, idioms, and the rules that keep it correct and portable.'
    practices:
      - text: Use fixed-width and size types (size_t, uint32_t), never assume int width.
        source: https://gustedt.gitlabpages.inria.fr/modern-c/
      - text: Compile with -Wall -Wextra -Werror and run ASan/UBSan in CI.
        source: https://github.com/google/sanitizers/wiki
    resources:
      - name: Modern C (Jens Gustedt, free online edition)
        url: https://gustedt.gitlabpages.inria.fr/modern-c/
        kind: docs
        license: CC-BY-NC-ND-4.0
        tier: 1
        use: reference
        note: The reference book for C17/C23 style; read before writing new C.
      - name: Beej's Guide to C Programming
        url: https://beej.us/guide/bgc/
        kind: guide
        license: CC-BY-NC-ND-3.0
        tier: 1
        use: reference
        note: Approachable complete tutorial, kept current; good for agents filling gaps fast.
      - name: SEI CERT C Coding Standard
        url: https://wiki.sei.cmu.edu/confluence/display/c/SEI+CERT+C+Coding+Standard
        kind: checklist
        license: none
        tier: 1
        use: reference
        note: Rule list for secure C (integers, strings, memory); cite rule ids in reviews.
      - name: WG14 C standard committee drafts
        url: https://www.open-std.org/jtc1/sc22/wg14/
        kind: docs
        license: none
        tier: 2
        use: reference
        note: Latest C23 working drafts when a precise standard answer is needed.
      - name: Cosmopolitan Libc
        url: https://github.com/jart/cosmopolitan
        kind: repo
        license: ISC
        stars: 21419
        pushed: 2026-10-20
        archived: false
        tier: 3
        use: install
        note: Build-once-run-anywhere C binaries (Linux/mac/Windows/BSD); niche but unique. musl.libc.org is the small static libc alternative.
    see_also: [systems.c.sanitizers, systems.c.safe-strings-memory]

  - id: systems.c.safe-strings-memory
    title: Safe string and memory handling in C
    area: c
    why: 'Avoiding buffer overflows and lifetime bugs: safer string types, arena patterns, bounds-checked parsing.'
    practices:
      - text: Never use strcpy/strcat/sprintf; use length-aware APIs or a sized string type.
        source: https://wiki.sei.cmu.edu/confluence/display/c/SEI+CERT+C+Coding+Standard
      - text: Group allocations by lifetime in an arena instead of pairing every malloc with a free.
        source: https://nullprogram.com/blog/2023/09/27/
    resources:
      - name: sds (Simple Dynamic Strings)
        url: https://github.com/antirez/sds
        kind: repo
        license: BSD-2-Clause
        stars: 5586
        pushed: 2025-04-18
        archived: false
        tier: 1
        use: vendor
        note: Redis' length-prefixed, binary-safe strings; two files to drop in instead of hand-rolled strcpy code.
      - name: 'Chris Wellons: My personal C coding style as of late 2023'
        url: https://nullprogram.com/blog/2023/10/08/
        kind: guide
        license: none
        tier: 1
        use: reference
        note: 'Concrete modern C conventions: sized strings, arenas, assertions; read with the arena post.'
      - name: 'Chris Wellons: Arena allocator tips and tricks'
        url: https://nullprogram.com/blog/2023/09/27/
        kind: guide
        license: none
        tier: 1
        use: reference
        note: Why arenas remove most free() bugs in C; code you can copy.
      - name: 'SEI CERT C: STR and MEM rules'
        url: https://wiki.sei.cmu.edu/confluence/display/c/SEI+CERT+C+Coding+Standard
        kind: checklist
        license: none
        tier: 2
        use: reference
        note: Review checklist for string/memory functions (STR31-C, MEM30-C...).
      - name: Wuffs
        url: https://github.com/google/wuffs
        kind: repo
        license: NOASSERTION
        stars: 4870
        pushed: 2026-10-21
        archived: false
        tier: 3
        use: install
        note: Memory-safe language/transpiler for parsing untrusted file formats into C; use when decoding images/archives.
    see_also: [systems.memory.arena-allocators, security.lang.c-cpp]


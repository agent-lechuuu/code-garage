  - id: systems.cpp.core-guidelines
    title: C++ Core Guidelines and reference
    area: cpp
    why: The rules modern C++ code is reviewed against, and the reference everyone links.
    practices:
      - text: Prefer value semantics, RAII and smart pointers; no owning raw pointers (R.3).
        source: https://github.com/isocpp/CppCoreGuidelines
      - text: Enable -Wall -Wextra -Wpedantic -Wconversion and treat warnings as errors in CI.
        source: https://github.com/cpp-best-practices/cppbestpractices

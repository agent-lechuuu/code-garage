  - id: systems.linux.systemd-units-hardening
    title: systemd units and service hardening
    area: linux
    why: Writing service units correctly and sandboxing them (capabilities, filesystem, syscalls).
    practices:
      - text: Start from DynamicUser=yes, ProtectSystem=strict, ProtectHome=yes, PrivateTmp=yes, NoNewPrivileges=yes and open up only what breaks.
        source: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html
      - text: Check `systemd-analyze security unit.service` and `systemd-analyze verify` before enabling.
        source: https://www.freedesktop.org/software/systemd/man/latest/systemd-analyze.html
      - text: Use Type=notify with sd_notify (or Type=exec) and Restart=on-failure with RestartSec.
        source: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html
    resources:
      - name: systemd.exec(5)
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html
        kind: docs
        license: LGPL-2.1-or-later
        tier: 1
        use: reference
        note: 'Every sandboxing directive: ProtectSystem, PrivateTmp, CapabilityBoundingSet, SystemCallFilter, DynamicUser.'
      - name: systemd.service(5)
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html
        kind: docs
        license: LGPL-2.1-or-later
        tier: 1
        use: reference
        note: Type=, Restart=, ExecStart semantics, notify.
      - name: systemd-analyze(1) security
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd-analyze.html
        kind: docs
        license: LGPL-2.1-or-later
        tier: 1
        use: reference
        note: '`systemd-analyze security <unit>` scores exposure 0-10; aim below 3.'
      - name: shh (Systemd Hardening Helper)
        url: https://github.com/desbma/shh
        kind: tool
        license: GPL-3.0
        stars: 384
        pushed: 2026-08-29
        archived: false
        tier: 1
        use: install
        note: Runs the service under strace and generates the tightest hardening options that still work (GPL tool).
      - name: capabilities(7)

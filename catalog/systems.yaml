  - id: systems.perf.low-latency-linux-tuning
    title: Linux tuning for low latency and precise time
    area: perf
    why: Isolating cores, taming interrupts/timers, huge pages, governors, and PTP/TSC timekeeping for jitter-free hosts.
    practices:
      - text: Pin hot threads to isolated cores (isolcpus/nohz_full/rcu_nocbs or cgroup cpusets) and move IRQs off them.
        source: https://rigtorp.se/low-latency-guide/
      - text: Use the performance governor and disable THP/NUMA balancing on latency boxes; verify with hiccups.
        source: https://rigtorp.se/low-latency-guide/
      - text: Pre-fault and lock memory (mlockall, huge pages) to avoid page faults on the hot path.
        source: https://rigtorp.se/low-latency-guide/
    resources:
      - name: Low Latency Tuning Guide (Erik Rigtorp)
        url: https://rigtorp.se/low-latency-guide/
        kind: guide

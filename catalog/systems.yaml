  - id: systems.shell.bash-strict-mode-pitfalls
    title: Bash strict mode, pitfalls and error handling
    area: shell
    why: Writing Bash that fails loudly and correctly; knowing the traps of set -e, word splitting and subshells.
    practices:
      - text: Start scripts with `set -Eeuo pipefail` and understand its limits (command lists, pipelines, subshells).
        source: https://mywiki.wooledge.org/BashFAQ/105
      - text: Quote every expansion ("$var", "${arr[@]}"); use [[ ]] for tests and $(...) for substitution.
        source: https://mywiki.wooledge.org/BashPitfalls
      - text: Use `trap cleanup EXIT` with mktemp -d for temp files; check `command -v tool` not `which`.
        source: https://www.shellcheck.net/wiki/
      - text: Prefer printf over echo; never parse ls output; iterate with globs or `find -print0 | while IFS= read -r -d ''`.
        source: https://mywiki.wooledge.org/BashPitfalls
    resources:
      - name: BashPitfalls (Greg's Wiki)
        url: https://mywiki.wooledge.org/BashPitfalls
        kind: checklist
        license: none
        tier: 1
        use: reference
        note: The 60+ classic mistakes with fixes; read before reviewing any script.
      - name: 'BashFAQ/105: why doesn''t set -e do what I expected?'
        url: https://mywiki.wooledge.org/BashFAQ/105
        kind: guide
        license: none
        tier: 1
        use: reference
        note: The caveats of errexit; explains when to prefer explicit checks.
      - name: Unofficial Bash Strict Mode (Aaron Maxwell)
        url: http://redsymbol.net/articles/unofficial-bash-strict-mode/
        kind: guide
        license: none
        tier: 1
        use: reference
        note: set -euo pipefail with IFS handling and the known issues.
      - name: BashGuide (Greg's Wiki)
        url: https://mywiki.wooledge.org/BashGuide
        kind: guide
        license: none
        tier: 1
        use: reference
        note: Correct-by-construction Bash tutorial (quoting, arrays, tests).
      - name: ShellCheck wiki (SCxxxx explanations)
        url: https://www.shellcheck.net/wiki/
        kind: docs
        license: none
        tier: 1
        use: reference
        note: Every ShellCheck warning explained with the fix.
    see_also: [systems.shell.shellcheck-shfmt-shellharden, systems.shell.testing-bats]


  - id: systems.linux.kernel-tuning-sysctl-cgroups
    title: sysctl kernel tuning and cgroups v2 resource control
    area: linux
    why: Setting kernel parameters safely and limiting CPU/memory/IO per service.
    practices:
      - text: Persist settings in /etc/sysctl.d/*.conf and apply with `sysctl --system`; verify with `sysctl -a`.
        source: https://docs.kernel.org/admin-guide/sysctl/index.html
      - text: Prefer MemoryMax/CPUQuota on units over manual cgroup files; systemd owns the cgroup tree.
        source: https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html
    resources:
      - name: Kernel sysctl documentation

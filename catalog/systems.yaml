  - id: systems.perf.io-uring-zero-copy-io
    title: io_uring and zero-copy I/O on Linux
    area: perf
    why: Batching syscalls and avoiding copies (io_uring, splice/sendfile, MSG_ZEROCOPY) for high-throughput I/O.
    practices:
      - text: Batch submissions and use multishot/provided buffers; io_uring wins only when you amortize syscalls.
        source: https://github.com/axboe/liburing/wiki/io_uring-and-networking-in-2023
      - text: Zero-copy send is only worth it for large buffers; copies beat completion notifications for small writes.
        source: https://docs.kernel.org/networking/msg_zerocopy.html
    resources:

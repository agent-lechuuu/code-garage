  - id: web3.standards.eip712-signatures
    title: Typed-data signatures (EIP-712, ERC-1271, ERC-6492) and signature security
    area: standards
    why: Off-chain orders, permits, meta-transactions and smart-account verification all hinge on getting signatures right.
    practices:
      - text: Always include chainId and verifyingContract in the domain, a nonce and a deadline; reject malleable signatures (use OZ ECDSA or Solady).
        source: https://eips.ethereum.org/EIPS/eip-712
      - text: Verify signatures from contracts via ERC-1271 (and ERC-6492 for counterfactual accounts), not just ecrecover.
        source: https://github.com/AmbireTech/signature-validator
    resources:
      - name: EIP-712 spec
        url: https://eips.ethereum.org/EIPS/eip-712
        kind: docs
        license: CC0-1.0
        tier: 1
        use: reference
        note: Hashing and encoding rules; domain separator.
      - name: OZ EIP712 + SignatureChecker + ECDSA

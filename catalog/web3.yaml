  - id: web3.solana.security-pitfalls
    title: Solana program security pitfalls (sealevel attacks and guides)
    area: solana
    why: Solana's account model has its own bug classes (missing signer/owner checks, PDA validation, arbitrary CPI, type cosplay); every auditor checks these.
    practices:
      - text: Validate owner, signer, PDA seeds/bump and account type for every account; never trust an account because the client passed it.
        source: https://github.com/coral-xyz/sealevel-attacks
      - text: Check the program id of every CPI target and avoid arbitrary CPI; use typed CPI wrappers.
        source: https://www.helius.dev/blog/a-hitchhikers-guide-to-solana-program-security

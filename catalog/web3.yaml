  - id: web3.evm.solidity-style
    title: Solidity style, NatSpec, linting and formatting
    area: evm
    why: Consistent style and complete NatSpec make contracts reviewable by auditors and agents alike.
    practices:
      - text: Follow the official style guide (CapWords contracts, mixedCase functions, _prefix for internal/private, ordering of functions).
        source: https://docs.soliditylang.org/en/latest/style-guide.html
      - text: Document every public/external function with NatSpec (@notice, @param, @return, @dev); tooling and wallets read it.
        source: https://docs.soliditylang.org/en/latest/natspec-format.html
      - text: Run forge fmt (or prettier-plugin-solidity) and solhint in CI; do not argue about formatting in review.
        source: https://github.com/protofire/solhint
    resources:
      - name: Solidity style guide (official)
        url: https://docs.soliditylang.org/en/latest/style-guide.html
        kind: docs
        license: CC0-1.0
        tier: 1
        use: reference
        note: The baseline every other guide extends.
      - name: Coinbase Solidity style guide
        url: https://github.com/coinbase/solidity-style-guide
        kind: guide
        license: none
        stars: 499
        pushed: 2025-06-12
        archived: false
        tier: 2
        use: reference
        note: Opinionated additions (errors over require strings, named imports, test naming). No licence file.
      - name: solhint

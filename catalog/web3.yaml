  - id: web3.upgrades.proxies
    title: Upgradeable contracts (Transparent, UUPS, Beacon) and storage layout safety
    area: upgrades
    why: Upgradeability is where storage-collision and uninitialised-implementation bugs live; use the plugins that check for you.
    practices:
      - text: Validate every upgrade with the OZ Upgrades plugin (storage layout, initializers, no selfdestruct/delegatecall) in CI.
        source: https://docs.openzeppelin.com/upgrades-plugins
      - text: Use namespaced storage (ERC-7201) in new upgradeable code and _disableInitializers() in implementation constructors.
        source: https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable
      - text: Put the upgrade authority behind a multisig + timelock; document the upgrade runbook.
        source: https://getfoundry.sh/guides/upgrading-contracts
    resources:
      - name: OpenZeppelin Upgrades plugins (Hardhat/Foundry)

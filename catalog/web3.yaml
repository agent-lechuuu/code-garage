  - id: web3.defi.oracles
    title: Price oracles (Chainlink, Pyth, RedStone, Switchboard) and manipulation resistance
    area: defi
    why: Every lending/perp/stablecoin needs prices; oracle misuse is a top-3 exploit cause.
    practices:
      - text: Check staleness (updatedAt/publishTime), answer > 0, min/max circuit-breaker bounds and sequencer uptime on L2s for every feed read.
        source: https://docs.chain.link/data-feeds
      - text: Never use a spot AMM price (or reserves) as an oracle; use TWAPs only with manipulation-cost analysis.
        source: https://samczsun.com/so-you-want-to-use-a-price-oracle/

  - id: web3.evm.deployment-scripts
    title: Deployment scripts and deterministic (CREATE2/CREATE3) deployment
    area: evm
    why: Reproducible, same-address multi-chain deployments and safe broadcast workflows.
    practices:
      - text: Simulate, then broadcast, then verify; keep broadcast JSON in git as the deployment record.
        source: https://getfoundry.sh/forge/broadcast-files
      - text: Use CreateX or the deterministic-deployment-proxy for the same address on every chain; never rely on nonce ordering.
        source: https://github.com/pcaversaccio/createx
    resources:

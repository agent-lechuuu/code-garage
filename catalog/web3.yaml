  - id: web3.upgrades.diamonds
    title: EIP-2535 Diamonds (and why to be careful)
    area: upgrades
    why: Multi-facet proxies for very large systems; powerful but complex, with real audit risk.
    practices:
      - text: Prefer a single UUPS/transparent proxy unless you truly exceed the 24KB limit; diamonds add selector-routing and storage-collision risk.
        source: https://blog.trailofbits.com/2020/10/30/good-idea-bad-design-how-the-diamond-standard-falls-short/

  - id: web3.evm.foundry
    title: Foundry toolchain (forge, cast, anvil, chisel)
    area: evm
    why: 'The default Solidity toolchain in 2026: compile, test, fuzz, script, fork and debug from one Rust binary.'
    practices:
      - text: Follow the Foundry best-practices page for layout, naming, test organisation and script hygiene before inventing your own.
        source: https://getfoundry.sh/best-practices
      - text: Use forge lint (unsafe-cheatcode) in CI; forge geiger is deprecated in favour of it.
        source: https://getfoundry.sh/reference/forge/geiger
      - text: Never put deployer private keys in .env for forge script; use cast wallet keystores or a browser/hardware wallet.
        source: https://getfoundry.sh/cast/wallet-operations

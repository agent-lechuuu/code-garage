  - id: web3.standards.erc4626-vaults
    title: ERC-4626 tokenised vaults
    area: standards
    why: The share-accounting standard for yield vaults; inflation attacks and rounding are the classic pitfalls.
    practices:
      - text: Mitigate first-depositor inflation with virtual shares/decimals offset (OZ default) or a dead-shares seed deposit.
        source: https://docs.openzeppelin.com/contracts/5.x/erc4626
      - text: Run a16z erc4626-tests and crytic/properties ERC4626 suite against every vault.
        source: https://github.com/a16z/erc4626-tests

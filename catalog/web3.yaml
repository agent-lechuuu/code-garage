  - id: web3.evm.foundry-fuzz-invariant
    title: Fuzz and invariant testing with Foundry
    area: evm
    why: Property-based and stateful invariant tests catch the bugs unit tests miss; this is the expected baseline before an audit.
    practices:
      - text: Write invariant tests with a handler contract and ghost variables; bound inputs with bound() rather than vm.assume.
        source: https://getfoundry.sh/guides/invariant-testing
      - text: Persist and replay the fuzz corpus in CI so regressions are caught deterministically.
        source: https://getfoundry.sh/guides/fuzz-corpus
      - text: Reuse pre-built property suites (ERC-20/4626/ABDK math) instead of writing properties from scratch.
        source: https://github.com/crytic/properties
    resources:
      - name: Foundry invariant testing guide
        url: https://getfoundry.sh/guides/invariant-testing
        kind: guide
        license: Apache-2.0
        tier: 1
        use: reference
        note: Official handler/ghost-variable pattern; configuration lives under /config/testing.
      - name: weth-invariant-testing (horsefacts)
        url: https://github.com/horsefacts/weth-invariant-testing
        kind: repo
        license: GPL-3.0
        stars: 292
        pushed: 2026-01-19
        archived: false
        tier: 1
        use: reference
        note: The canonical worked example of handler-based invariants on WETH; read before writing your first suite.
      - name: Recon Chimera + create-chimera-app
        url: https://github.com/Recon-Fuzz/create-chimera-app
        kind: template
        license: none
        stars: 53
        pushed: 2026-04-01
        archived: false
        tier: 2
        use: reference
        note: Starter that runs the same invariants under Foundry, Echidna, Medusa and Halmos; framework repo Recon-Fuzz/chimera (165 stars). No licence file.
      - name: crytic/properties
        url: https://github.com/crytic/properties
        kind: repo
        license: AGPL-3.0
        stars: 372
        pushed: 2026-03-09
        archived: false
        tier: 1
        use: reference
        note: Trail of Bits property suites for ERC-20, ERC-4626, ERC-721 and ABDKMath; AGPL so copy ideas, not code, into closed projects.
      - name: a16z erc4626-tests
        url: https://github.com/a16z/erc4626-tests

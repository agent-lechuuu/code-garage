  - id: engineering.ci.github-actions-security-and-linting
    title: GitHub Actions security hardening and linting
    area: ci
    why: Prevent script injection, pwn requests and supply-chain pulls in workflows; lint YAML before it runs.
    practices:
      - text: Pin third-party actions to a full commit SHA and let Renovate/Dependabot bump them.
        source: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
      - text: 'Never interpolate ${{ github.event.* }} into run: scripts; pass through env vars.'
        source: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections

        kind: guide
        license: none
        tier: 1
        use: reference
        note: Retry budgets, where retries belong in the stack, avoiding retry storms.
      - name: Designing robust APIs with idempotency (Stripe)
        url: https://stripe.com/blog/idempotency
        kind: guide
        license: none
        tier: 1
        use: reference
        note: Idempotency-Key header semantics; brandur.org/idempotency-keys shows the Postgres implementation.

  - id: engineering.system-design.retries-idempotency
    title: Retries, backoff, jitter and idempotency keys
    area: system-design
    why: 'Make clients and APIs safe to retry: exponential backoff with jitter, retry budgets, idempotency keys.'
    practices:
      - text: Add jitter to every exponential backoff; synchronised retries are what turn a blip into an outage.
        source: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
      - text: Cap retries with a budget (e.g. 10% of requests) rather than a fixed count per call.
        source: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
      - text: Store idempotency keys with the response and scope them per user/API key; replay the stored result on duplicate.
        source: https://stripe.com/blog/idempotency
    resources:
      - name: Exponential backoff and jitter (AWS)
        url: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
        kind: guide
        license: none
        tier: 1
        use: reference
        note: Marc Brooker's simulation of full/equal/decorrelated jitter.
      - name: Timeouts, retries and backoff with jitter (Builders' Library)

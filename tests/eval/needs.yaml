# Code Garage search evaluation set (E1, 2026-10-30).
#
# About 60 needs an AI coding agent would type into `garage search`, weighted to the owner's interests: web3
# (Solidity, Solana), AI agents / Claude skills / MCP, systems (C, C++, Rust), backend and safe databases, frontend,
# security, engineering practice. The owner's ten real needs from the end-to-end test are included and marked
# "Owner need N" in the note. Queries mix jargon and plain words on purpose ("ring buffer" vs "SPSC queue").
#
# The expected answers come from the author's knowledge of what is best, not from what the garage returns today.
#
# Schema: {needs: [{q, slice, ideal: [topic ids or rids], acceptable: [topic ids or rids], note}]}
#   q           the query, as an agent would phrase it
#   slice       the slice the need belongs to (for per-slice totals)
#   ideal       best answers, best first. A topic id matches when the top result is that topic; a rid (normalized
#               URL, GitHub .../tree/HEAD/<path> for sub-folders) matches when the top result's best resource is it.
#   acceptable  relevant but not the ideal pick, best first.
#   note        why these are the answers; anything a scorer or a reviewer should know.
#
# Scoring (tools/garage/evalset.py, the REPORT's 2/1/0 definitions):
#   2  the top result is ideal and usable
#   1  the top result is acceptable, or an ideal answer is in rank 2-3 (needs digging), or the top result is ideal
#      but its best pick is a runnable item still in quarantine or archived (readable, not addable)
#   0  nothing ideal or acceptable in the top 3

